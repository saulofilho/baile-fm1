name: Deploy static site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build the web emulator
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld python3
          source/web/make_emulator.sh
      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      # deploy-pages lists this run's artifacts once, with no retry, and the one just uploaded is not always in that
      # list yet: "No artifacts named github-pages were found" (runs 44901375266, 45052566204). So: wait, then one retry.
      - name: Let the artifact reach the list
        run: sleep 10
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (retry)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
